services:
  # mongo:
  #   image: mongo
  #   container_name: mongo-container
  #   ports:
  #     - "27017:27017"
  #   env_file:
  #     - ./template-back/.env
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - template_net

  # Backend
  backend:
    build:
      context: ./template-back
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./template-back/.env
    environment:
      - FRONT_URL=http://localhost:3000,http://frontend
    networks:
      - template_net

  # Frontend
  frontend:
    build:
      context: ./template-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://backend:5000/api
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    env_file:
      - ./template-front/.env
    environment:
      - REACT_APP_API_URL=http://backend:5000/api
    # environment:
    #   - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://frontend
    depends_on:
      - backend
    networks:
      - template_net

# volumes:
#   mongo_data:

networks:
  template_net:
    driver: bridge
